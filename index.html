<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6d5efc" />
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%236d5efc%27/%3E%3Cstop offset=%271%27 stop-color=%27%23d94fd5%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M9 16l5 5 9-10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="app">
    <header class="app-header">
      <div class="heading">
        <h1>Todo</h1>
        <p id="tagline" class="tagline">Let's make today count.</p>
      </div>

      <div class="progress" role="img" aria-labelledby="progress-label">
        <svg viewBox="0 0 48 48" class="ring">
          <circle class="ring-track" cx="24" cy="24" r="20" />
          <circle id="ring-value" class="ring-value" cx="24" cy="24" r="20" />
        </svg>
        <span id="progress-percent" class="progress-percent">0%</span>
        <span id="progress-label" class="visually-hidden">0% complete</span>
      </div>
    </header>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <input id="new-todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" required />
      <button type="submit" aria-label="Add todo">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="M12 5v14M5 12h14" /></svg>
        <span>Add</span>
      </button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count" class="count"></span>
      <div id="filters" class="filters" role="group" aria-label="Filter">
        <span id="filter-glow" class="filter-glow" aria-hidden="true"></span>
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="done">Done</button>
      </div>
    </footer>

    <button id="clear-done" class="clear-completed">Clear completed</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
