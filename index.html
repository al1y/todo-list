<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230969da%27/%3E%3Cpath d=%27M9 16l5 5 9-10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <input id="new-todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" required />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count"></span>
      <div class="filters" role="group" aria-label="Filter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="done">Done</button>
      </div>
    </footer>

    <button id="clear-done" class="clear-completed">Clear completed</button>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!-- larger header + footer per review -->
